name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}

      - name: Add cPanel host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files to cPanel
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='Dockerfile' \
            --exclude='.dockerignore' \
            ./ "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_PATH }}/"

      - name: Install production dependencies on cPanel
        run: |
          ssh "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}" "cd '${{ secrets.CPANEL_PATH }}' && npm install --omit=dev --no-audit --no-fund"
